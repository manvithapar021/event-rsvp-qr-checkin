{% extends "base.html" %}
{% block content %}
<h1>Create an Event</h1>
<form method="post" class="card card-body mt-3" style="max-width: 640px;">
  <div class="mb-3"><label class="form-label">Event name</label>
    <input class="form-control" name="name" required placeholder="e.g. AI &amp; Machine Learning Workshop"></div>
  <div class="mb-3"><label class="form-label">Date &amp; time</label>
    <input class="form-control" type="datetime-local" name="date_time" required></div>
  <div class="mb-3"><label class="form-label">Venue</label>
    <input class="form-control" name="venue" required placeholder="e.g. TP Ganesan Auditorium, SRMIST"></div>
  <div class="mb-3"><label class="form-label">Capacity</label>
    <input class="form-control" type="number" name="capacity" min="1" value="50" required></div>
  <div class="mb-3"><label class="form-label">Description</label>
    <textarea class="form-control" name="description" rows="3"></textarea></div>
  <button class="btn btn-primary" type="submit">Create Event</button>
</form>
{% endblock %}
