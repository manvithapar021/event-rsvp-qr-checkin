{% extends "base.html" %}
{% block content %}
<h1>Check-in Desk</h1>
<p class="text-muted">Type or scan a QR code. Each ticket can be checked in only once.</p>
{% if result %}
  <div class="alert alert-{{ result[0] }}">{{ result[1] }}</div>
{% endif %}
<form method="post" class="card card-body" style="max-width: 520px;">
  <div class="mb-3"><label class="form-label">QR code</label>
    <input class="form-control form-control-lg" name="code" value="{{ code }}" autofocus
           placeholder="e.g. A1B2C3D4E5F6" autocomplete="off"></div>
  <button class="btn btn-success btn-lg" type="submit">Check In</button>
</form>
<p class="text-muted mt-3 small">Tip: a QR scanner can open <code>/checkin?code=XXXX</code> and check the person in directly.</p>
{% endblock %}
